server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/campusai_market?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:campusai}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-chat

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: 1440

app:
  storage:
    upload-dir: ${UPLOAD_DIR:/app/uploads}
    max-image-size: 5242880
    max-image-count: 5
