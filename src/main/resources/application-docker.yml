server:
  port: 8080

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/campusai_market?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:campusai}
    password: ${MYSQL_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat

    embedding:
      transformer:
        cache:
          enabled: true
        onnx:
          model-uri: ${EMBEDDING_MODEL_URI:https://hf-mirror.com/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx}
        tokenizer:
          uri: ${EMBEDDING_TOKENIZER_URI:https://hf-mirror.com/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json}

jwt:
  secret: ${JWT_SECRET:docker-dev-secret-change-me-at-least-32-chars}
  expiration-minutes: 1440
