spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
spring.ai.model.embedding=none
spring.ai.openai.chat.options.max-tokens=1200

app.storage.upload-dir=${UPLOAD_DIR:./uploads}
app.storage.max-image-size=5242880
app.storage.max-image-count=5

app.rag.enabled=${RAG_ENABLED:true}
app.rag.model-uri=${EMBEDDING_MODEL_URI:https://hf-mirror.com/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx}
app.rag.tokenizer-uri=${EMBEDDING_TOKENIZER_URI:https://hf-mirror.com/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json}
app.rag.cache-directory=${EMBEDDING_CACHE_DIR:./.model-cache}
